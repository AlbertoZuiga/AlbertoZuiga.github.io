<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon base (SVG) -->
    <link rel="icon" href="/favicon.svg?v=3" sizes="any" type="image/svg+xml" />
    <link
      rel="alternate icon"
      href="/favicon.svg?v=3"
      sizes="any"
      type="image/svg+xml"
    />
    <!-- PNG fallbacks -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png?v=3"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png?v=3"
    />
    <!-- ICO (legacy) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <!-- Apple Touch -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=3"
    />
    <!-- Pinned tab / theme color -->
    <link rel="mask-icon" href="/favicon.svg?v=3" color="#0073ba" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <title> y metas SEO/OG por página: src/components/SEO.jsx (React 19) -->

    <!-- JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Alberto Zúñiga",
        "url": "https://albertozuiga.github.io",
        "image": "https://albertozuiga.github.io/og-image.png",
        "jobTitle": "Desarrollador Full Stack",
        "sameAs": [
          "https://github.com/AlbertoZuiga",
          "https://www.linkedin.com/in/alberto-zuniga-marinovic/"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Alberto Zúñiga Portfolio",
        "url": "https://albertozuiga.github.io",
        "inLanguage": "es-CL"
      }
    </script>
  </head>
  <body>
    <!-- Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Support for GitHub Pages SPA routing
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
